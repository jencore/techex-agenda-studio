<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechEx Agenda Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* ── Tokens ─────────────────────────────────────────── */
:root {
  --navy:   #0E1428;
  --gold:   #CEA93A;
  --teal-a: #0E7070;
  --teal-b: #0C6060;
  --pill:   #0A5555;
  --bg:     #EEF1F6;
  --surf:   #FFFFFF;
  --surf2:  #F5F7FA;
  --bdr:    #D8DCE6;
  --txt:    #141926;
  --muted:  #697387;
  --accent: #0E6060;
  --ok:     #0A7A50;
  --err:    #C0392B;
  --warn:   #B07A00;
  --rad:    8px;
  --shad:   0 1px 4px rgba(10,16,40,.07), 0 4px 16px rgba(10,16,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0F1A; --surf: #151C2E; --surf2: #1C2540;
    --bdr: #252F4A; --txt: #DDE3F5; --muted: #7A88A8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0F1A; --surf: #151C2E; --surf2: #1C2540;
  --bdr: #252F4A; --txt: #DDE3F5; --muted: #7A88A8;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5}

/* ── Shell ───────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:270px 1fr;grid-template-rows:56px 1fr;height:100%}
@media(max-width:700px){.shell{grid-template-columns:1fr;grid-template-rows:56px auto 1fr}}

.topbar{
  grid-column:1/-1;display:flex;align-items:center;gap:12px;
  padding:0 20px;background:var(--navy);color:#fff;
  border-bottom:2px solid var(--gold);
}
.topbar-logo{width:32px;height:32px;border-radius:6px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;letter-spacing:.2px}
.topbar-sub{font-size:12px;opacity:.6;margin-left:2px}
.topbar-spacer{flex:1}
.topbar-btn{
  padding:6px 14px;border-radius:5px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:#fff;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s;
}
.topbar-btn:hover{background:rgba(255,255,255,.16)}
.topbar-btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.topbar-btn.gold:hover{background:#B8952E}

/* ── Sidebar ─────────────────────────────────────────── */
.sidebar{background:var(--surf);border-right:1px solid var(--bdr);overflow-y:auto;display:flex;flex-direction:column}
.sidebar-head{
  padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--surf);z-index:1;
}
.sidebar-head-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.add-btn{
  display:flex;align-items:center;gap:5px;padding:5px 10px;
  border:1px solid var(--bdr);border-radius:5px;background:var(--surf2);color:var(--txt);
  font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;
}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}
.agenda-list{flex:1;padding:8px}
.agenda-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-radius:6px;cursor:pointer;border:1px solid transparent;
  transition:all .15s;margin-bottom:2px;
}
.agenda-item:hover{background:var(--surf2);border-color:var(--bdr)}
.agenda-item.active{background:var(--surf2);border-color:var(--accent)}
.agenda-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,.3)}
.agenda-item-info{flex:1;min-width:0}
.agenda-item-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-item-url{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-status{flex-shrink:0;width:8px;height:8px;border-radius:50%}
.status-idle{background:var(--bdr)}
.status-loading{background:#F59E0B;animation:pulse 1s infinite}
.status-ok{background:#10B981}
.status-err{background:#EF4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.agenda-del{opacity:0;padding:2px 5px;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:3px;font-size:14px;transition:all .12s}
.agenda-item:hover .agenda-del{opacity:.7}
.agenda-del:hover{opacity:1!important;color:var(--err)}

/* ── Main panel ──────────────────────────────────────── */
.main{overflow-y:auto;display:flex;flex-direction:column}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px;text-align:center;color:var(--muted)}
.empty-icon{font-size:48px;opacity:.3}
.empty-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;color:var(--txt)}
.empty-sub{font-size:14px;max-width:360px;line-height:1.6}

/* ── Editor ──────────────────────────────────────────── */
.editor{padding:20px;display:flex;flex-direction:column;gap:20px;flex:1}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rad);box-shadow:var(--shad);overflow:hidden}
.card-head{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.card-head-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.card-body{padding:16px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field:last-child{margin-bottom:0}
label{font-size:12px;font-weight:600;color:var(--txt)}
.lhint{font-weight:400;color:var(--muted);font-size:11px;margin-left:5px}
input[type=text],input[type=url],select,textarea{
  width:100%;padding:8px 12px;border:1px solid var(--bdr);border-radius:6px;
  background:var(--bg);color:var(--txt);font-family:inherit;font-size:13px;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
input[type=text]:focus,input[type=url]:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(14,96,96,.15)}
textarea{resize:vertical;min-height:72px;font-family:monospace;font-size:12px}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-row input,.input-row select{flex:1;min-width:0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 16px;border:none;border-radius:6px;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:not(:disabled):hover{background:#0A4E4E}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:not(:disabled):hover{background:#B8952E}
.btn-ghost{background:transparent;color:var(--txt);border:1px solid var(--bdr)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-danger{background:var(--err);color:#fff}
.color-row{display:flex;gap:8px;align-items:center}
.color-row input[type=color]{width:36px;height:36px;border-radius:5px;border:1px solid var(--bdr);cursor:pointer;padding:2px;background:var(--bg);flex-shrink:0}
.color-row input[type=text]{flex:1;font-family:monospace;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.status-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:6px;font-size:13px;font-weight:500}
.status-bar.loading{background:rgba(14,96,96,.1);color:var(--accent)}
.status-bar.error{background:rgba(192,57,43,.08);color:var(--err)}
.status-bar.success{background:rgba(10,122,80,.08);color:var(--ok)}
.spin{width:14px;height:14px;flex-shrink:0;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sessions-list{display:flex;flex-direction:column;gap:2px}
.sitem{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:9px 12px;border-radius:5px;font-size:12px;background:var(--surf2)}
.sitem.brk{background:rgba(206,169,58,.07);color:var(--muted);font-style:italic}
.stime{font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;color:var(--accent);padding-top:2px;font-variant-numeric:tabular-nums}
.stype{font-weight:700}
.spk{margin-top:3px;color:var(--muted);line-height:1.6}
.spk strong{color:var(--txt);font-weight:600}
.logo-dropzone{border:2px dashed var(--bdr);border-radius:6px;padding:20px;text-align:center;cursor:pointer;transition:all .15s;color:var(--muted);font-size:13px}
.logo-dropzone:hover,.logo-dropzone.drag{border-color:var(--accent);background:rgba(14,96,96,.04)}
.logo-preview{max-height:60px;max-width:180px;margin-top:10px;border-radius:4px}
.preview-wrap{background:#1A1A2E;border-radius:var(--rad);overflow:hidden}
.preview-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surf);border-bottom:1px solid var(--bdr)}
.preview-toolbar-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px}
.preview-actions{display:flex;gap:6px}
.preview-scaler{padding:20px;display:flex;justify-content:center;min-height:200px;overflow-x:auto}
#svg-mount{transform-origin:top center;line-height:0}
#svg-mount svg{display:block}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surf);border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.modal-head{padding:20px 20px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px}
.modal-close:hover{color:var(--txt);background:var(--surf2)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end}
.batch-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--bdr);border-radius:6px;background:var(--surf2)}
.batch-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.batch-info{flex:1;min-width:0}
.batch-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batch-url{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batch-progress{font-size:12px;color:var(--muted);flex-shrink:0;width:80px;text-align:right}
.batch-tick{font-size:16px;flex-shrink:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="shell">
  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-logo">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="1" y="1" width="8" height="8" rx="1.5" fill="#CEA93A"/>
        <rect x="11" y="1" width="8" height="8" rx="1.5" fill="#0E7070"/>
        <rect x="1" y="11" width="8" height="8" rx="1.5" fill="#0E7070"/>
        <rect x="11" y="11" width="8" height="8" rx="1.5" fill="#CEA93A" opacity=".45"/>
      </svg>
    </div>
    <span class="topbar-title">TechEx Agenda Studio</span>
    <span class="topbar-sub">1080 × 1920</span>
    <div class="topbar-spacer"></div>
    <button class="topbar-btn" onclick="showBatchModal()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="8" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="8" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
      Batch export all
    </button>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-head-title">Agendas <span id="agenda-count" style="font-weight:400;font-size:11px"></span></span>
      <button class="add-btn" onclick="addAgenda()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Add
      </button>
    </div>
    <div class="agenda-list" id="agenda-list"></div>
  </aside>

  <!-- Main editor -->
  <main class="main" id="main-panel">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-title">No agenda selected</div>
      <div class="empty-sub">Add an agenda, paste the event URL, and generate your 1080×1920 design.</div>
      <button class="btn btn-primary" onclick="addAgenda()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add first agenda
      </button>
    </div>
    <div class="editor" id="editor" hidden></div>
  </main>
</div>

<!-- Batch modal -->
<div class="modal-overlay" id="batch-modal" hidden onclick="if(event.target===this)hideBatchModal()">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">Batch Export</span>
      <button class="modal-close" onclick="hideBatchModal()">×</button>
    </div>
    <div class="modal-body" id="batch-body"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" onclick="hideBatchModal()">Close</button>
      <button class="btn btn-gold btn-sm" id="batch-run-btn" onclick="runBatchExport()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v8M3 6l3.5 3.5L10 6M1 11h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export all SVGs
      </button>
    </div>
  </div>
</div>

<script>
/* ── State ───────────────────────────────────────────── */
let agendas = loadState();
let activeId = agendas[0]?.id ?? null;

function newAgenda(o={}) {
  return {
    id: crypto.randomUUID(),
    url: '', label: 'New agenda',
    trackName: 'GOLD TRACK', subtitle: '', dayLabel: 'DAY 1',
    highlightColor: '#CEA93A', rowA: '#0E7070', rowB: '#0C6060',
    pageNum: '1', pageTotal: '1',
    logoDataUrl: null, logoName: null,
    sessions: [], status: 'idle', err: null, ...o
  };
}
function loadState() {
  try { const r=localStorage.getItem('techex-agendas-v1'); if(r) return JSON.parse(r); } catch(e){}
  return [];
}
function saveState() {
  try { localStorage.setItem('techex-agendas-v1', JSON.stringify(agendas)); } catch(e){}
}
function getActive() { return agendas.find(a=>a.id===activeId); }

/* ── Sidebar ─────────────────────────────────────────── */
function renderSidebar() {
  const list = document.getElementById('agenda-list');
  list.innerHTML = '';
  document.getElementById('agenda-count').textContent = agendas.length ? `(${agendas.length})` : '';
  agendas.forEach(a => {
    const div = document.createElement('div');
    div.className = 'agenda-item'+(a.id===activeId?' active':'');
    div.dataset.id = a.id;
    div.innerHTML = `
      <div class="agenda-dot" style="background:${esc(a.highlightColor||'#CEA93A')}"></div>
      <div class="agenda-item-info">
        <div class="agenda-item-title">${esc(a.label||'Untitled')}</div>
        <div class="agenda-item-url">${esc(a.url||'No URL set')}</div>
      </div>
      <div class="agenda-status status-${a.status==='ok'?'ok':a.status==='err'?'err':a.status==='loading'?'loading':'idle'}"></div>
      <button class="agenda-del" title="Delete" onclick="deleteAgenda('${a.id}',event)">×</button>`;
    div.addEventListener('click', ()=>selectAgenda(a.id));
    list.appendChild(div);
  });
}
function addAgenda() { const a=newAgenda(); agendas.push(a); saveState(); selectAgenda(a.id); }
function deleteAgenda(id,e) {
  e.stopPropagation();
  if(!confirm('Remove this agenda?')) return;
  agendas=agendas.filter(a=>a.id!==id);
  if(activeId===id) activeId=agendas[0]?.id??null;
  saveState(); renderSidebar(); renderEditor();
}
function selectAgenda(id) { activeId=id; renderSidebar(); renderEditor(); }

/* ── Editor ──────────────────────────────────────────── */
function renderEditor() {
  const a = getActive();
  const empty = document.getElementById('empty-state');
  const editor = document.getElementById('editor');
  if(!a){ empty.hidden=false; editor.hidden=true; return; }
  empty.hidden=true; editor.hidden=false;

  editor.innerHTML = `
    <div class="card">
      <div class="card-head"><span class="card-head-title">Agenda URL</span></div>
      <div class="card-body">
        <div class="field">
          <label>Agenda page URL</label>
          <div class="input-row">
            <input type="url" id="e-url" value="${esc(a.url)}" placeholder="https://…" oninput="patch('url',this.value)">
            <button class="btn btn-primary btn-sm" id="fetch-btn" onclick="fetchAgenda()">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v8M3 5.5l3.5 3.5L10 5.5M1 11h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Fetch
            </button>
          </div>
        </div>
        <div id="fetch-status" ${a.status==='idle'?'hidden':''}>${statusHtml(a)}</div>
        ${a.status==='err'?`
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)">
          <label style="font-size:12px;font-weight:600;color:var(--muted)">Or paste raw page HTML <span class="lhint">(browser → Ctrl+U → Select All → Copy)</span></label>
          <textarea id="paste-html" placeholder="Paste full page source here…" style="margin-top:6px;height:100px"></textarea>
          <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="parsePastedHtml()">Parse pasted HTML</button>
        </div>`:''}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-head-title">Design settings</span></div>
      <div class="card-body">
        <div class="grid2">
          <div class="field">
            <label>Day label</label>
            <input type="text" id="e-day" value="${esc(a.dayLabel)}" placeholder="DAY 1" oninput="patch('dayLabel',this.value)">
          </div>
          <div class="field">
            <label>Track bar label</label>
            <input type="text" id="e-track" value="${esc(a.trackName)}" placeholder="GOLD TRACK" oninput="patch('trackName',this.value)">
          </div>
          <div class="field" style="grid-column:1/-1">
            <label>Header subtitle</label>
            <input type="text" id="e-sub" value="${esc(a.subtitle)}" placeholder="e.g. Cybersecurity Leadership &amp; Enterprise Risk" oninput="patch('subtitle',this.value)">
          </div>
          <div class="field">
            <label>Page</label>
            <div style="display:flex;gap:6px;align-items:center">
              <input type="text" id="e-pn" value="${esc(a.pageNum)}" style="max-width:50px;text-align:center" oninput="patch('pageNum',this.value)">
              <span style="color:var(--muted)">/</span>
              <input type="text" id="e-pt" value="${esc(a.pageTotal)}" style="max-width:50px;text-align:center" oninput="patch('pageTotal',this.value)">
            </div>
          </div>
          <div class="field">
            <label>Track bar colour</label>
            <div class="color-row">
              <input type="color" id="e-col-h" value="${esc(a.highlightColor)}" oninput="patchColor('highlightColor',this.value,'e-col-h-hex')">
              <input type="text" id="e-col-h-hex" value="${esc(a.highlightColor)}" maxlength="7" oninput="patchColorHex('highlightColor',this.value,'e-col-h')">
            </div>
          </div>
          <div class="field">
            <label>Row colour A</label>
            <div class="color-row">
              <input type="color" id="e-col-a" value="${esc(a.rowA)}" oninput="patchColor('rowA',this.value,'e-col-a-hex')">
              <input type="text" id="e-col-a-hex" value="${esc(a.rowA)}" maxlength="7" oninput="patchColorHex('rowA',this.value,'e-col-a')">
            </div>
          </div>
          <div class="field">
            <label>Row colour B</label>
            <div class="color-row">
              <input type="color" id="e-col-b" value="${esc(a.rowB)}" oninput="patchColor('rowB',this.value,'e-col-b-hex')">
              <input type="text" id="e-col-b-hex" value="${esc(a.rowB)}" maxlength="7" oninput="patchColorHex('rowB',this.value,'e-col-b')">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-head-title">Sponsor logo <span class="lhint">optional</span></span>
        ${a.logoDataUrl?`<button class="btn btn-ghost btn-sm" onclick="removeLogo()">Remove</button>`:''}
      </div>
      <div class="card-body">
        ${a.logoDataUrl
          ?`<div style="text-align:center"><img src="${a.logoDataUrl}" class="logo-preview" alt="logo"></div>`
          :`<div class="logo-dropzone" id="logo-drop" onclick="document.getElementById('logo-input').click()"
              ondragover="event.preventDefault();this.classList.add('drag')"
              ondragleave="this.classList.remove('drag')"
              ondrop="handleLogoDrop(event)">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="margin:0 auto 8px;display:block;opacity:.4"><path d="M12 16V8M8 12l4-4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/></svg>
              Click or drag PNG / SVG / JPG logo here
            </div>
            <input type="file" id="logo-input" accept="image/*" hidden onchange="handleLogoFile(this.files[0])">`}
      </div>
    </div>

    ${a.sessions.length?`
    <div class="card">
      <div class="card-head">
        <span class="card-head-title">Sessions (${a.sessions.filter(s=>!s.isBreak).length} sessions, ${a.sessions.filter(s=>s.isBreak).length} breaks)</span>
        <button class="btn btn-ghost btn-sm" onclick="fetchAgenda()">↺ Re-fetch</button>
      </div>
      <div class="card-body"><div class="sessions-list">${sessionsHtml(a.sessions)}</div></div>
    </div>`:''}

    <div class="card preview-wrap">
      <div class="preview-toolbar">
        <span class="preview-toolbar-title">Preview</span>
        <div class="preview-actions">
          <button class="btn btn-ghost btn-sm" onclick="buildAndPreview()">↺ Regenerate</button>
          <button class="btn btn-gold btn-sm" id="dl-btn" onclick="downloadCurrent()" ${a.sessions.length===0?'disabled':''}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v8M3 6l3.5 3.5L10 6M1 11h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Download SVG
          </button>
        </div>
      </div>
      <div class="preview-scaler"><div id="svg-mount"></div></div>
    </div>
  `;
  if(a.sessions.length) buildAndPreview();
}

function statusHtml(a) {
  if(a.status==='loading') return `<div class="status-bar loading"><div class="spin"></div><span>Fetching agenda…</span></div>`;
  if(a.status==='err')     return `<div class="status-bar error">⚠ ${esc(a.err||'Unknown error')}</div>`;
  if(a.status==='ok')      return `<div class="status-bar success">✓ Parsed ${a.sessions.filter(s=>!s.isBreak).length} sessions and ${a.sessions.filter(s=>s.isBreak).length} break(s)</div>`;
  return '';
}
function sessionsHtml(sessions) {
  return sessions.map(s=>{
    if(s.isBreak) return `<div class="sitem brk"><div class="stime">${esc(s.time)}</div><div>${esc(s.rawTitle||s.title||'Break')}</div></div>`;
    const spk=s.speakers.map(sp=>`<strong>${esc(sp.name)}</strong>${(sp.role||sp.company)?', '+esc([sp.role,sp.company].filter(Boolean).join(', ')):''}`).join('<br>');
    return `<div class="sitem"><div class="stime">${esc(s.time)}</div><div>${s.type?`<span class="stype">${esc(s.type)}:</span> `:''}<span style="color:var(--muted)">${esc(s.title)}</span>${spk?`<div class="spk">${spk}</div>`:''}</div></div>`;
  }).join('');
}

/* ── Patch helpers ───────────────────────────────────── */
function patch(key,val){const a=getActive();if(!a)return;a[key]=val;if(key==='url')a.label=urlToLabel(val);saveState();if(key==='url')renderSidebar();}
function patchColor(key,val,hexId){patch(key,val);const el=document.getElementById(hexId);if(el)el.value=val;renderSidebar();}
function patchColorHex(key,val,pickId){if(!/^#[0-9a-fA-F]{6}$/.test(val))return;patch(key,val);const el=document.getElementById(pickId);if(el)el.value=val;renderSidebar();}
function urlToLabel(url){try{const u=new URL(url);const segs=u.pathname.replace(/\/+$/,'').split('/').filter(Boolean);const slug=segs[segs.length-1]||segs[segs.length-2]||'agenda';return slug.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).slice(0,40);}catch(e){return'New agenda';}}

/* ── Logo ────────────────────────────────────────────── */
function handleLogoFile(file){if(!file)return;const reader=new FileReader();reader.onload=e=>{const a=getActive();if(!a)return;a.logoDataUrl=e.target.result;a.logoName=file.name;saveState();renderEditor();};reader.readAsDataURL(file);}
function handleLogoDrop(e){e.preventDefault();document.getElementById('logo-drop')?.classList.remove('drag');const file=e.dataTransfer.files[0];if(file&&file.type.startsWith('image/'))handleLogoFile(file);}
function removeLogo(){const a=getActive();if(!a)return;a.logoDataUrl=null;a.logoName=null;saveState();renderEditor();}

/* ── Fetch ───────────────────────────────────────────── */
async function fetchAgenda() {
  const a = getActive(); if(!a) return;
  const urlEl = document.getElementById('e-url');
  const url = urlEl ? urlEl.value.trim() : a.url;
  if(!url){alert('Please enter a URL first');return;}
  a.url=url; a.label=urlToLabel(url); a.status='loading'; a.err=null;
  saveState(); renderSidebar();
  const statusEl = document.getElementById('fetch-status');
  if(statusEl){statusEl.hidden=false;statusEl.innerHTML=statusHtml(a);}
  document.getElementById('fetch-btn')?.setAttribute('disabled','');

  try {
    const res = await fetch('/api/fetch-agenda', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || `Server error ${res.status}`);
    a.sessions = data.sessions;
    if(data.meta){
      if(data.meta.dayLabel && a.dayLabel==='DAY 1') a.dayLabel=data.meta.dayLabel;
      if(data.meta.subtitle) a.subtitle=data.meta.subtitle;
      if(data.meta.trackName) a.trackName=data.meta.trackName;
    }
    a.status='ok';
  } catch(e){
    a.status='err'; a.err=e.message;
  }
  saveState(); renderSidebar(); renderEditor();
}

function parsePastedHtml() {
  const a=getActive();if(!a)return;
  const html=document.getElementById('paste-html')?.value?.trim();
  if(!html){alert('Paste the page HTML first');return;}
  // Send to server for parsing
  fetch('/api/parse-html',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({html,url:a.url||''})})
    .then(r=>r.json()).then(data=>{
      if(data.error){alert('Parse error: '+data.error);return;}
      a.sessions=data.sessions;
      if(data.meta){if(data.meta.dayLabel)a.dayLabel=data.meta.dayLabel;if(data.meta.subtitle)a.subtitle=data.meta.subtitle;if(data.meta.trackName)a.trackName=data.meta.trackName;}
      a.status='ok';a.err=null;saveState();renderSidebar();renderEditor();
    }).catch(e=>alert('Error: '+e.message));
}

/* ── SVG Builder ─────────────────────────────────────── */
function buildSVG(a) {
  const navy='#0E1428', gold=a.highlightColor||'#CEA93A';
  const tealA=a.rowA||'#0E7070', tealB=a.rowB||'#0C6060';
  const pill=darken(tealA,.15);
  const FONT='Montserrat, Arial, sans-serif';
  const W=1080,HDR=240,GOLD_H=50,FTR=90;
  const PX=28,PILLW=220,PILLH=54,PILLR=6;
  const CX=PX+PILLW+22, MAXW=W-CX-30;
  const LH=26, LHS=23;

  function wrap(str,maxW,px,bold){
    const cw=bold?px*.62:px*.56;
    const words=(str||'').split(' ');
    const lines=[];let line='';
    for(const w of words){const t=line?line+' '+w:w;if(t.length*cw>maxW&&line){lines.push(line);line=w;}else line=t;}
    if(line)lines.push(line);
    return lines;
  }

  const LOGO_H=a.logoDataUrl?80:0;
  const TOTAL_HDR=HDR+LOGO_H;

  function rowH(s){
    if(s.isBreak)return 52;
    const tl=wrap((s.type?s.type+': ':'')+s.title,MAXW,19,false);
    let spL=0;
    s.speakers.forEach(sp=>{spL+=wrap([sp.name,sp.role,sp.company].filter(Boolean).join(', '),MAXW,16,false).length;});
    return Math.max(88,16+tl.length*LH+(spL?6:0)+spL*LHS+16);
  }

  const totalContentH=a.sessions.reduce((s,r)=>s+rowH(r),0);
  const SVG_H=TOTAL_HDR+totalContentH+FTR;
  const parts=[];

  parts.push(`<rect width="${W}" height="${SVG_H}" fill="${navy}"/>`);
  parts.push(`<rect x="0" y="0" width="${W}" height="${TOTAL_HDR}" fill="${navy}"/>`);
  parts.push(`<text x="${W/2}" y="80" font-family="${FONT}" font-weight="800" font-size="32" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">${esc(a.dayLabel||'DAY 1')}</text>`);

  const subLines=wrap(a.subtitle||'',W-120,40,false);
  subLines.forEach((line,i)=>{
    parts.push(`<text x="${W/2}" y="${130+i*50}" font-family="${FONT}" font-weight="400" font-size="40" fill="#FFFFFF" text-anchor="middle">${esc(line)}</text>`);
  });

  if(a.logoDataUrl){
    parts.push(`<image href="${a.logoDataUrl}" x="${W/2-120}" y="${HDR-10}" width="240" height="70" preserveAspectRatio="xMidYMid meet"/>`);
  }

  const goldY=TOTAL_HDR-GOLD_H;
  parts.push(`<rect x="0" y="${goldY}" width="${W}" height="${GOLD_H}" fill="${gold}"/>`);
  parts.push(`<text x="${W/2}" y="${goldY+32}" font-family="${FONT}" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">${esc(a.trackName||'GOLD TRACK')}</text>`);

  let y=TOTAL_HDR;
  a.sessions.forEach((s,idx)=>{
    const rh=rowH(s);
    const rowFill=s.isBreak?'#FFFFFF':(idx%2===0?tealA:tealB);
    parts.push(`<rect x="0" y="${y}" width="${W}" height="${rh}" fill="${rowFill}"/>`);
    if(s.isBreak){
      const py=y+(rh-PILLH)/2;
      parts.push(`<rect x="${PX}" y="${py}" width="${PILLW}" height="${PILLH}" rx="${PILLR}" fill="#E0E0E0"/>`);
      parts.push(`<text x="${PX+PILLW/2}" y="${py+PILLH/2+7}" font-family="${FONT}" font-weight="700" font-size="19" fill="#333" text-anchor="middle">${esc(s.time)}</text>`);
      const bl=(s.rawTitle||s.title||'Break').toUpperCase();
      parts.push(`<text x="${CX}" y="${y+rh/2+8}" font-family="${FONT}" font-weight="700" font-size="21" fill="#1A1F2E">${esc(bl)}</text>`);
    } else {
      const py=y+16;
      parts.push(`<rect x="${PX}" y="${py}" width="${PILLW}" height="${PILLH}" rx="${PILLR}" fill="${pill}"/>`);
      parts.push(`<text x="${PX+PILLW/2}" y="${py+PILLH/2+8}" font-family="${FONT}" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">${esc(s.time)}</text>`);
      let ty=y+20+19;
      if(s.type){
        const typeW=s.type.length*19*0.62, afterW=(' '+s.title).length*19*0.56;
        if(typeW+afterW<MAXW){
          parts.push(`<text x="${CX}" y="${ty}" font-family="${FONT}" font-size="19" fill="#FFFFFF"><tspan font-weight="700">${esc(s.type+':')}</tspan><tspan font-weight="400"> ${esc(s.title)}</tspan></text>`);
          ty+=LH;
        } else {
          parts.push(`<text x="${CX}" y="${ty}" font-family="${FONT}" font-weight="700" font-size="19" fill="#FFFFFF">${esc(s.type+':')}</text>`); ty+=LH;
          wrap(s.title,MAXW,19,false).forEach(l=>{parts.push(`<text x="${CX}" y="${ty}" font-family="${FONT}" font-weight="400" font-size="19" fill="#FFFFFF">${esc(l)}</text>`);ty+=LH;});
        }
      } else {
        wrap(s.title||s.rawTitle||'',MAXW,19,false).forEach(l=>{parts.push(`<text x="${CX}" y="${ty}" font-family="${FONT}" font-weight="700" font-size="19" fill="#FFFFFF">${esc(l)}</text>`);ty+=LH;});
      }
      if(s.speakers.length)ty+=4;
      s.speakers.forEach(sp=>{
        const full=[sp.role,sp.company].filter(Boolean).join(', ');
        const nw=(sp.name+', ').length*16*0.64;
        if(nw+full.length*16*0.57<MAXW){
          parts.push(`<text x="${CX}" y="${ty}" font-family="${FONT}" font-size="16" fill="#FFFFFF"><tspan font-weight="700">${esc(sp.name)},</tspan><tspan font-weight="400"> ${esc(full)}</tspan></text>`);ty+=LHS;
        } else {
          parts.push(`<text x="${CX}" y="${ty}" font-family="${FONT}" font-weight="700" font-size="16" fill="#FFFFFF">${esc(sp.name)}</text>`);ty+=LHS;
          if(full){wrap(full,MAXW,16,false).forEach(l=>{parts.push(`<text x="${CX+8}" y="${ty}" font-family="${FONT}" font-weight="400" font-size="16" fill="#FFFFFF">${esc(l)}</text>`);ty+=LHS;});}
        }
      });
    }
    y+=rh;
  });

  parts.push(`<rect x="0" y="${y}" width="${W}" height="${FTR}" fill="${navy}"/>`);
  parts.push(`<text x="${W/2}" y="${y+FTR/2+10}" font-family="${FONT}" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">PAGE ${esc(a.pageNum||'1')}/${esc(a.pageTotal||'1')}</text>`);

  return `<svg width="${W}" height="${SVG_H}" viewBox="0 0 ${W} ${SVG_H}" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">\n${parts.join('\n')}\n</svg>`;
}

function buildAndPreview(){
  const a=getActive();if(!a)return;
  const svg=buildSVG(a);
  const mount=document.getElementById('svg-mount');if(!mount)return;
  mount.innerHTML=svg;
  const W=1080, available=mount.parentElement.offsetWidth-40;
  const scale=Math.min(1,available/W);
  const svgEl=mount.querySelector('svg');
  const H=parseInt(svgEl?.getAttribute('height')||'1920');
  mount.style.transform=`scale(${scale})`;
  mount.style.transformOrigin='top center';
  mount.style.width=W+'px';
  mount.style.marginBottom=`${(H*scale)-H}px`;
}

/* ── Download ────────────────────────────────────────── */
async function downloadCurrent(){
  const a=getActive();if(!a||!a.sessions.length)return;
  const svgStr=buildSVG(a);
  saveSVG(svgStr,`TechEx_${(a.dayLabel||'Day').replace(/\s+/g,'_')}_${(a.trackName||'Track').replace(/\s+/g,'_').replace(/[^a-z0-9_]/gi,'')}.svg`);
}
function saveSVG(svgStr,filename){
  const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a2=document.createElement('a');a2.href=url;a2.download=filename;
  document.body.appendChild(a2);a2.click();document.body.removeChild(a2);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ── Batch export ────────────────────────────────────── */
function showBatchModal(){
  const body=document.getElementById('batch-body');
  body.innerHTML=agendas.length===0
    ?'<p style="color:var(--muted);text-align:center;padding:20px">No agendas added yet.</p>'
    :agendas.map(a=>`
      <div class="batch-row" id="br-${a.id}">
        <div class="batch-dot" style="background:${esc(a.highlightColor||'#CEA93A')}"></div>
        <div class="batch-info"><div class="batch-name">${esc(a.label||'Untitled')}</div><div class="batch-url">${esc(a.url||'No URL')}</div></div>
        <div class="batch-progress" id="bp-${a.id}">${a.status==='ok'?'Ready':a.status==='err'?'Error':'Pending'}</div>
        <div class="batch-tick" id="bt-${a.id}">${a.status==='ok'?'✓':a.status==='err'?'⚠':'○'}</div>
      </div>`).join('');
  document.getElementById('batch-modal').hidden=false;
}
function hideBatchModal(){document.getElementById('batch-modal').hidden=true;}

async function runBatchExport(){
  const btn=document.getElementById('batch-run-btn');
  btn.disabled=true;btn.textContent='Exporting…';
  for(const a of agendas){
    const prog=document.getElementById(`bp-${a.id}`);
    const tick=document.getElementById(`bt-${a.id}`);
    if(!prog)continue;
    if(a.status!=='ok'){
      if(!a.url){prog.textContent='Skip (no URL)';continue;}
      prog.textContent='Fetching…';tick.textContent='⟳';
      try{
        const res=await fetch('/api/fetch-agenda',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:a.url})});
        const data=await res.json();
        if(!res.ok)throw new Error(data.error||'Failed');
        a.sessions=data.sessions;
        if(data.meta){if(data.meta.dayLabel)a.dayLabel=data.meta.dayLabel;if(data.meta.subtitle)a.subtitle=data.meta.subtitle;if(data.meta.trackName)a.trackName=data.meta.trackName;}
        a.status='ok';saveState();
      }catch(e){a.status='err';a.err=e.message;prog.textContent='Failed';tick.textContent='✗';continue;}
    }
    prog.textContent='Building…';
    const svg=buildSVG(a);
    const fn=`TechEx_${(a.dayLabel||'Day').replace(/\s+/g,'_')}_${(a.trackName||'Track').replace(/\s+/g,'_').replace(/[^a-z0-9_]/gi,'')}_p${a.pageNum||1}.svg`;
    saveSVG(svg,fn);
    prog.textContent='Saved ✓';tick.textContent='✓';
    await new Promise(r=>setTimeout(r,600));
  }
  btn.disabled=false;btn.innerHTML='Done — close';btn.onclick=hideBatchModal;
  renderSidebar();
}

/* ── Utils ───────────────────────────────────────────── */
function darken(hex,amt){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'#'+[r,g,b].map(x=>Math.max(0,Math.floor(x*(1-amt))).toString(16).padStart(2,'0')).join('');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

/* ── Init ────────────────────────────────────────────── */
renderSidebar();
renderEditor();
window.addEventListener('resize',()=>{if(getActive()?.sessions.length)buildAndPreview();});
</script>
